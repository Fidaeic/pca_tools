[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-tools"
version = "0.2.12"
description = "Latent-structure PCA tools for multivariate statistical process control"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fidae El Morer", email = "elmorer.fidae@gmail.com"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "altair>=5,<7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0"
]

[project.optional-dependencies]
dev = ["build>=1.2", "pyarrow>=14", "pytest>=8", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Fidaeic/pca_tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["pca_tools"]
